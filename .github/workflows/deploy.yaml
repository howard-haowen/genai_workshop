name: Deploy All

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js for Marp
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Prepare build directory
        run: |
          mkdir -p build
          chmod 777 build

      - name: Copy root landing page
        run: cp index.html build/index.html

      - name: Build 2025 workshop pages (Marp)
        run: |
          mkdir -p build/2025
          chmod 777 build/2025

          # Copy pre-built *.html static files (e.g. index.html)
          for file in workshops/2025/*.html; do
            [ -e "$file" ] || continue
            cp "$file" "build/2025/$(basename "$file")"
          done

          # Build HTML from *_marp.md source files using Marp
          for file in workshops/2025/*_marp.md; do
            [ -e "$file" ] || continue
            marp "$file" --output "build/2025/$(basename "${file%.md}.html")"
          done

          # Copy apps/ directory if present
          if [ -d "workshops/2025/apps" ]; then
            mkdir -p build/2025/apps
            chmod 777 build/2025/apps
            cp -r workshops/2025/apps/. build/2025/apps/
          fi

      - name: Build 2026 workshop pages
        run: |
          mkdir -p build/2026
          chmod 777 build/2026

          # Copy all *.html files
          for file in workshops/2026/*.html; do
            [ -e "$file" ] || continue
            cp "$file" "build/2026/$(basename "$file")"
          done

          # Copy haowen-projects/ directory if present
          if [ -d "workshops/2026/haowen-projects" ]; then
            mkdir -p build/2026/haowen-projects
            chmod 777 build/2026/haowen-projects
            cp -r workshops/2026/haowen-projects/. build/2026/haowen-projects/
          fi

      - name: Deploy preview (PRs)
        if: ${{ github.event_name == 'pull_request' }}
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./build/
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      - name: Deploy to GitHub Pages (main branch)
        if: ${{ github.event_name == 'push' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
