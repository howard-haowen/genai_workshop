<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="diagram-title">
  <title id="diagram-title">Make Data AI-Ready: Convert to Markdown First</title>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .label { font-family: system-ui, Arial, sans-serif; font-size: 13px; fill: #475569; }
      .label-bold { font-family: system-ui, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
      .ext { font-family: 'Courier New', monospace; font-size: 14px; font-weight: 700; }
      .section-title { font-family: system-ui, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: #94a3b8; }
      .md-label { font-family: 'Courier New', monospace; font-size: 22px; font-weight: 900; fill: #0f172a; }
      .arrow-label { font-family: system-ui, Arial, sans-serif; font-size: 11px; fill: #64748b; }
      .caption { font-family: system-ui, Arial, sans-serif; font-size: 12px; fill: #64748b; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" rx="16" class="bg" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ===== Section 1: INPUT ===== -->
  <text x="60" y="38" class="section-title">INPUT  (Binary / Proprietary)</text>

  <!-- PPTX -->
  <rect x="30" y="50" width="100" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="82" text-anchor="middle" class="ext" fill="#b45309">.pptx</text>
  <text x="80" y="100" text-anchor="middle" class="label">Presentation</text>

  <!-- DOCX -->
  <rect x="150" y="50" width="100" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="82" text-anchor="middle" class="ext" fill="#1d4ed8">.docx</text>
  <text x="200" y="100" text-anchor="middle" class="label">Document</text>

  <!-- PDF -->
  <rect x="270" y="50" width="100" height="70" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="320" y="82" text-anchor="middle" class="ext" fill="#b91c1c">.pdf</text>
  <text x="320" y="100" text-anchor="middle" class="label">PDF</text>

  <!-- XLS -->
  <rect x="390" y="50" width="100" height="70" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="440" y="82" text-anchor="middle" class="ext" fill="#065f46">.xlsx</text>
  <text x="440" y="100" text-anchor="middle" class="label">Spreadsheet</text>

  <!-- Arrows from inputs down -->
  <line x1="80"  y1="120" x2="80"  y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="120" x2="200" y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="320" y1="120" x2="320" y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="120" x2="440" y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Funnel lines converging to MD box -->
  <line x1="80"  y1="170" x2="260" y2="230" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="200" y1="170" x2="265" y2="230" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="320" y1="170" x2="275" y2="230" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="440" y1="170" x2="280" y2="230" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Convert label -->
  <rect x="88" y="180" width="120" height="22" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="148" y="195" text-anchor="middle" class="arrow-label">Convert / Extract</text>

  <!-- ===== MARKDOWN CENTER BOX ===== -->
  <rect x="220" y="230" width="110" height="80" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="275" y="262" text-anchor="middle" dominant-baseline="middle" class="md-label" fill="#f1f5f9">.md</text>
  <text x="275" y="283" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#94a3b8">Markdown</text>
  <text x="275" y="299" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,Arial,sans-serif" font-size="10" fill="#64748b">Plain Text · AI-Ready</text>

  <!-- ===== AI ENGINE ===== -->
  <!-- Arrow from MD to AI -->
  <line x1="330" y1="270" x2="490" y2="270" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)" stroke-dasharray="6,3"/>
  <rect x="352" y="256" width="80" height="20" rx="4" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1"/>
  <text x="392" y="270" text-anchor="middle" class="arrow-label" fill="#059669">AI processes</text>

  <!-- AI box -->
  <rect x="490" y="235" width="110" height="70" rx="14" fill="#4f46e5" stroke="#3730a3" stroke-width="2"/>
  <text x="545" y="263" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="900" fill="#ffffff">AI</text>
  <text x="545" y="282" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#c7d2fe">Agents</text>

  <!-- ===== Section 3: OUTPUT ===== -->
  <text x="630" y="38" class="section-title">OUTPUT  (Any Format)</text>

  <!-- Output arrows from AI -->
  <line x1="600" y1="255" x2="660" y2="160" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="265" x2="660" y2="235" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="275" x2="660" y2="310" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="285" x2="660" y2="380" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Output: Summary -->
  <rect x="660" y="120" width="120" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="720" y="147" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700" fill="#5b21b6">📄 Summary</text>
  <text x="720" y="165" text-anchor="middle" class="caption">Text report</text>

  <!-- Output: Slides -->
  <rect x="660" y="205" width="120" height="60" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="720" y="232" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700" fill="#9d174d">📊 Slides</text>
  <text x="720" y="250" text-anchor="middle" class="caption">Presentation</text>

  <!-- Output: Webpages -->
  <rect x="660" y="280" width="120" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="720" y="307" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700" fill="#475569">🌐 Webpages</text>
  <text x="720" y="325" text-anchor="middle" class="caption">HTML / Sites</text>

  <!-- Output: Code -->
  <rect x="660" y="350" width="120" height="50" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="720" y="373" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700" fill="#065f46">💻 Code</text>
  <text x="720" y="391" text-anchor="middle" class="caption">Script / App</text>

  <!-- ===== Bottom caption ===== -->
  <text x="450" y="413" text-anchor="middle" class="caption">Best Practice: Normalize all data to Markdown → AI can read, reason, and generate anything from it</text>
</svg>
